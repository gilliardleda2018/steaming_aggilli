# Aggilli Music - o player (index.html) deve ser revalidado a cada abertura.
# Sem isto, o WebView do APK continuava usando um player antigo depois de
# cada publicação. "no-cache" mantém o cache, mas exige confirmar o ETag
# com o servidor; se nada mudou, a resposta é 304 e nada é baixado.
# Catálogo, áudio e imagens não são afetados.
<LocationMatch "^/music/(index\.html)?$">
    Header set Cache-Control "no-cache"
</LocationMatch>
