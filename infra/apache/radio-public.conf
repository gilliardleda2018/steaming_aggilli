Listen 127.0.0.1:8100

<VirtualHost 127.0.0.1:8100>
    ServerName localhost
    DocumentRoot /var/www/aggilli-radio-public

    <Directory /var/www/aggilli-radio-public>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>


    ProxyAddHeaders Off

    # AGGILLI_MUSIC_PUBLIC_V1
    # Aggilli Music - caminho publico
    # AGGILLI_ONDEMAND_DIRECT_V1
    ProxyPass "/music/music-api/api/station/1/ondemand/download/" "http://127.0.0.1:8080/api/station/1/ondemand/download/"
    ProxyPassReverse "/music/music-api/api/station/1/ondemand/download/" "http://127.0.0.1:8080/api/station/1/ondemand/download/"

    # Aggilli Music - API administrativa
    ProxyPass "/music/upload-api/" "unix:/run/aggilli-music-upload/upload.sock|http://localhost/"
    ProxyPassReverse "/music/upload-api/" "http://localhost/"

    ProxyPass "/music/" "http://127.0.0.1:8300/"
    ProxyPassReverse "/music/" "http://127.0.0.1:8300/"

    ProxyRequests Off
    ProxyPass "/radio.mp3" "http://127.0.0.1:8080/listen/aggilli-radio/radio.mp3"
    ProxyPassReverse /radio.mp3 http://127.0.0.1:8080/listen/aggilli-radio/radio.mp3

    ErrorLog ${APACHE_LOG_DIR}/aggilli-radio-error.log
    CustomLog ${APACHE_LOG_DIR}/aggilli-radio-access.log combined
</VirtualHost>
