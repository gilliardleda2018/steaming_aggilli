# Aggilli Music - API comercial em homologação, no mesmo endereço do player
# (o botão "Pedir à ANI" só aceita uma API na mesma origem).
# Tem prioridade sobre o ProxyPass "/music/" do vhost 8100.
<Location "/music/commercial-api/">
    ProxyPass "unix:/run/aggilli-commercial/api.sock|http://localhost/"
    ProxyPassReverse "http://localhost/"
    LimitRequestBody 65536
</Location>
