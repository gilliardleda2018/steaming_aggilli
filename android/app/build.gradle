plugins { id 'com.android.application' }
def releaseInfo = new Properties()
rootProject.file('../release.properties').withInputStream { releaseInfo.load(it) }
android {
 namespace 'br.com.aggillintelligence.music'
 compileSdk 35
 defaultConfig {
  applicationId 'br.com.aggillintelligence.music'
  minSdk 26
  targetSdk 35
  versionCode releaseInfo.getProperty('versionCode').toInteger()
  versionName releaseInfo.getProperty('versionName')
 }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'androidx.webkit:webkit:1.12.1'
}
