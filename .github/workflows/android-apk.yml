name: Aggilli Music Android APK
on:
  push:
    branches: [feat/nextcloud-webdav-sync]
    paths:
      - 'android/**'
      - 'release.properties'
      - 'tests/**'
      - 'integrations/nextcloud_azura/**'
      - 'commercial/**'
      - 'player/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Validate synchronization Python code
        run: |
          python3 -m pip install httpx fastapi python-multipart bcrypt
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build installable debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AggilliMusic-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
