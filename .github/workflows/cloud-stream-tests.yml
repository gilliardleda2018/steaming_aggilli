name: Cloud streaming tests
on:
  pull_request:
    paths:
      - "backend/**"
      - "tests/**"
      - ".github/workflows/cloud-stream-tests.yml"
  push:
    branches:
      - feat/nextcloud-webdav-sync
    paths:
      - "backend/**"
      - "tests/**"
      - ".github/workflows/cloud-stream-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install "fastapi>=0.115,<1" "httpx>=0.28,<1" "python-multipart>=0.0.20" "bcrypt>=4,<6"
      - name: Compile source
        run: python -m compileall -q backend integrations/nextcloud
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
